<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rossalan Design — Blog Mockups</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #efecec;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .wrap { width: 100%; max-width: 640px; }
  .brand {
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #9a7340;
    margin-bottom: 28px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    font-weight: 500;
  }
  h1 {
    font-size: clamp(32px, 5vw, 44px);
    font-weight: 400;
    line-height: 1.15;
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }
  .lede {
    font-size: 16px;
    line-height: 1.55;
    color: #4a4a4a;
    margin-bottom: 44px;
    max-width: 520px;
  }
  .mockups { display: flex; flex-direction: column; gap: 1px; background: #d9d4ce; border-top: 1px solid #d9d4ce; border-bottom: 1px solid #d9d4ce; }
  .mockup {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 4px;
    background: #efecec;
    text-decoration: none;
    color: #1a1a1a;
    transition: background 0.15s ease, padding 0.2s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  .mockup:hover { background: #e6e2e0; padding-left: 10px; padding-right: 10px; }
  .mockup-title {
    font-size: 20px;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
  }
  .mockup-meta {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #9a7340;
  }
  .arrow {
    font-size: 20px;
    color: #9a7340;
    transition: transform 0.2s ease;
  }
  .mockup:hover .arrow { transform: translateX(4px); }
  .mockup-left { display: flex; flex-direction: column; gap: 4px; }
  footer {
    margin-top: 48px;
    font-size: 12px;
    color: #8a8a8a;
    letter-spacing: 0.08em;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  @media (max-width: 500px) {
    .mockup { padding: 20px 4px; }
    .mockup-title { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Rossalan Design</div>
  <h1>Blog Mockups</h1>
  <p class="lede">Two concept layouts for the blog experience. Click either to view the full mockup.</p>

  <nav class="mockups">
    <a class="mockup" href="blog-home.html">
      <div class="mockup-left">
        <span class="mockup-title">Blog Home</span>
        <span class="mockup-meta">Index / Landing</span>
      </div>
      <span class="arrow">&rarr;</span>
    </a>
    <a class="mockup" href="blog-post.html">
      <div class="mockup-left">
        <span class="mockup-title">Blog Post</span>
        <span class="mockup-meta">Article Template</span>
      </div>
      <span class="arrow">&rarr;</span>
    </a>
  </nav>

  <footer>For client review</footer>
</div>
</body>
</html>
